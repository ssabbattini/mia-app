name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v5

      - name: Installa Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Installa Java 21 (Richiesto dalle nuove versioni di Capacitor)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installa dipendenze e compila Web App
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Dai i permessi di esecuzione a Gradle e compila APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salva l'APK generato
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk